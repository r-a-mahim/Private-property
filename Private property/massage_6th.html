<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday ❤️</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      overflow-y: auto;
      background:
        radial-gradient(
          circle at top,
          #ffdde8,
          #ffe9f2,
          #ffd1dc,
          #17001f
        );
      min-height: 100vh;
    }

    .font-love {
      font-family: 'Pacifico', cursive;
    }

    .glass {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.45);

      box-shadow:
        0 25px 60px rgba(121, 0, 65, 0.25);
    }

    /* =========================
       CIRCLE IMAGE
    ========================= */

    .circle-img-container {
      width: 95px;
      height: 95px;

      border-radius: 50%;
      padding: 3.5px;

      background:
        linear-gradient(
          45deg,
          #ff416c,
          #ff4b2b,
          #ff69b4
        );

      box-shadow:
        0 0 25px rgba(255, 105, 180, 0.7);

      animation: pulseGlow 2.5s infinite alternate;

      flex-shrink: 0;
    }

    .circle-img-container img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      border: 2.5px solid white;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(1);
        box-shadow:
          0 0 12px rgba(255, 105, 180, 0.4);
      }

      100% {
        transform: scale(1.06);
        box-shadow:
          0 0 30px rgba(255, 20, 147, 0.9);
      }
    }

    /* =========================
       LYRICS MINI BOX
    ========================= */

    .empty-mini-box {
      border: 2px solid #ff4d8d;

      background: rgba(255, 255, 255, 0.7);

      border-radius: 16px;

      padding: 8px 12px;

      min-height: 85px;
      width: 170px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.06);

      flex-shrink: 0;

      overflow: hidden;

      position: relative;
    }

    /* =========================
       FLOATING HEARTS
    ========================= */

    .heart {
      position: fixed;

      bottom: -40px;

      color: rgba(255, 70, 130, 0.8);

      animation:
        floatHeart linear infinite;

      z-index: 1;

      pointer-events: none;
    }

    @keyframes floatHeart {
      0% {
        transform:
          translateY(0)
          rotate(0deg)
          scale(1);

        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-115vh)
          rotate(360deg)
          scale(1.8);

        opacity: 0;
      }
    }

    /* =========================
       SPARKLES
    ========================= */

    .sparkle {
      position: fixed;

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 12px white;

      animation:
        sparkle 2s infinite ease-in-out;

      z-index: 2;

      pointer-events: none;
    }

    @keyframes sparkle {
      0%,
      100% {
        transform: scale(0);
        opacity: 0;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* =========================
       ENVELOPE
    ========================= */

    .envelope-box {
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .envelope-box:hover {
      transform: scale(1.03);
    }

    /* =========================
       TYPEWRITER CURSOR
    ========================= */

    .typewriter-cursor::after {
      content: '|';

      animation:
        blink 0.7s infinite;

      color: #ff2a7a;

      font-weight: bold;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* =========================
       MODAL ANIMATION
    ========================= */

    .modal-enter {
      animation:
        popModal 0.6s
        cubic-bezier(
          0.175,
          0.885,
          0.32,
          1.275
        )
        forwards;
    }

    @keyframes popModal {
      from {
        opacity: 0;
        transform:
          scale(0.7)
          translateY(30px);
      }

      to {
        opacity: 1;
        transform:
          scale(1)
          translateY(0);
      }
    }

    /* =========================
       FADE
    ========================= */

    .fade-in-up {
      animation:
        fadeInUp 0.8s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       LYRICS TRANSITION
    ========================= */

    .lyrics-fade {
      transition:
        opacity 0.4s ease-in-out;
    }

    /* =========================
       TYPEWRITER TEXT
    ========================= */

    #typedText {
      white-space: pre-line;
      word-break: normal;
      overflow-wrap: break-word;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 640px) {
      .circle-img-container {
        width: 75px;
        height: 75px;
      }

      .empty-mini-box {
        width: 125px;
        min-height: 78px;
        padding: 6px 8px;
      }

      #lyricsBox {
        font-size: 9px;
      }
    }
  </style>
</head>

<body
  class="flex items-center justify-center p-4 relative text-gray-800 min-h-screen"
>

  <!-- =========================
       BACKGROUND MUSIC
  ========================== -->

  <audio
    id="bgMusic"
    loop
    src="musics/perfect.mp3"
  ></audio>


  <main
    class="relative z-10 w-full max-w-2xl my-auto"
  >

    <!-- =========================
         ENVELOPE SECTION
    ========================== -->

    <div
      id="envelopeSection"
      class="envelope-box glass rounded-[2.5rem] p-8 sm:p-12 text-center flex flex-col items-center justify-center min-h-[420px]"
    >

      <div
        class="text-7xl mb-4 animate-bounce"
      >
        💌
      </div>

      <h2
        class="font-love text-3xl sm:text-4xl text-pink-600 mb-3"
      >
        You Have A Secret Letter
      </h2>

      <p
        class="text-gray-700 text-sm sm:text-base font-medium mb-6"
      >
        Tap the envelope to open your birthday message ✨
      </p>

      <!--
        IMPORTANT:
        onclick="openLetter()" REMOVED

        কারণ parent envelope-এর click event
        already openLetter() call করছে।
      -->

      <button
        id="openLetterBtn"
        class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-8 py-3.5 rounded-full font-semibold shadow-lg hover:shadow-xl transition"
      >
        Open Letter ❤️
      </button>

    </div>


    <!-- =========================
         FINAL MESSAGE CARD
    ========================== -->

    <div
      id="cardSection"
      class="hidden glass rounded-[2.5rem] p-6 sm:p-10 text-center relative overflow-hidden transition-all duration-700 modal-enter"
    >

      <!-- =========================
           TOP SECTION
      ========================== -->

      <div
        class="flex items-center justify-between w-full mb-4 px-1 gap-2"
      >

        <!-- =========================
             LYRICS BOX
        ========================== -->

        <div class="empty-mini-box">

          <span
            class="text-[10px] text-pink-500 font-bold mb-0.5 tracking-wider"
          >
            🎶 PERFECT
          </span>

          <p
            id="lyricsBox"
            class="text-xs text-gray-700 font-medium text-center lyrics-fade px-1 opacity-0"
          >
            🎶
          </p>

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <div
          class="flex flex-col items-center text-center flex-grow px-2"
        >

          <h1
            class="font-love text-3xl sm:text-4xl text-gray-900 drop-shadow-sm leading-tight"
          >
            Happy Birthday Moon
          </h1>

          <div
            class="text-3xl mt-1 animate-pulse"
          >
            🎂
          </div>

        </div>


        <!-- =========================
             IMAGE
        ========================== -->

        <div class="circle-img-container">

          <img
            src="images/letter.jpg"
            alt="Special Memory"
          />

        </div>

      </div>


      <!-- =========================
           LETTER
      ========================== -->

      <div
        class="bg-white/40 backdrop-blur-md rounded-2xl p-6 sm:p-8 border border-white/60 shadow-inner mb-6 text-left sm:text-center"
      >

        <p
          id="typedText"
          class="text-gray-800 text-sm sm:text-base font-medium leading-relaxed sm:leading-loose typewriter-cursor min-h-[160px]"
        ></p>

      </div>


      <!-- =========================
           FINAL WISH BUTTON
      ========================== -->

      <div
        class="flex items-center justify-center"
      >

        <a
          id="finalWishBtn"
          href="Surprise.html"
          class="hidden bg-white hover:bg-gray-50 text-pink-600 font-bold px-8 py-3 rounded-full shadow-lg text-sm transition flex items-center gap-2 border border-pink-200 fade-in-up"
        >
          ✨ Final wish 🥺
        </a>

      </div>

    </div>

  </main>


  <script>

    /* =====================================================
       BIRTHDAY MESSAGE
    ===================================================== */

    const fullMessage =
      "Happy Birthday, Moon! 🌙✨\n\n" +
      "The best thing that ever happened to me is having you in my life. " +
      "You fill my world with so much laughter, light, and love. " +
      "May all your days be as bright and beautiful as your smile. " +
      "Stay by my side forever.🫂💞 " +
      "Happy Birthday, my personal property! ❤️\n\n" +
      "Wishing that Allah fills your life with boundless joy, glowing health, great success, and unconditional love, and grants every single prayer your heart whispers. I feel so blessed to call you mine. 🎀";
      


    /* =====================================================
       SONG LYRICS TIMING
    ===================================================== */

    const timedLyrics = [

      {
        time: 2.0,
        text:
          "Baby, I'm dancin' in the dark with you between my arms"
      },

      {
        time: 12.0,
        text:
          "Barefoot on the grass, listenin' to our favourite song"
      },

      {
        time: 20.0,
        text:
          "When you said you looked a mess, I whispered underneath my breath"
      },

      {
        time: 27.5,
        text:
          'But you heard it, "Darling, you look perfect tonight"'
      },

      {
        time: 41.0,
        text:
          "Well, I found a woman, stronger than anyone I know"
      },

      {
        time: 48.0,
        text:
          "She shares my dreams, I hope that someday, I'll share her home"
      },

      {
        time: 55.0,
        text:
          "I found a love to carry more than just my secrets"
      },

      {
        time: 65.0,
        text:
          "To carry love, to carry children of our own"
      },

      {
        time: 70.0,
        text:
          "We are still kids, but we're so in love, fighting against all odds"
      },

      {
        time: 79.0,
        text:
          "I know we'll be alright this time"
      },

      {
        time: 86.0,
        text:
          "Darling, just hold my hand, be my girl, I'll be your man"
      },

      {
        time: 93.0,
        text:
          "I see my future in your eyes"
      },

      {
        time: 105.0,
        text:
          "Baby, I'm dancin' in the dark with you between my arms"
      },

      {
        time: 117.0,
        text:
          "Barefoot on the grass, listenin' to our favourite song"
      },

      {
        time: 124.0,
        text:
          "When I saw you in that dress, lookin' so beautiful"
      },

      {
        time: 130.0,
        text:
          "I don't deserve this, darling, you look perfect tonight"
      },

      {
        time: 144.0,
        text:
          "No, no, no / Mm-hm"
      },

      {
        time: 151.0,
        text:
          "Baby, I'm dancin' in the dark with you between my arms"
      },

      {
        time: 161.0,
        text:
          "Barefoot on the grass, listenin' to our favourite song"
      },

      {
        time: 171.0,
        text:
          "I have faith in what I see, now I know I have met"
      },

      {
        time: 181.0,
        text:
          "An angel in person, and she looks perfect"
      },

      {
        time: 196.5,
        text:
          "I don't deserve this, you look perfect tonight ❤️"
      }

    ];


    /* =====================================================
       VARIABLES
    ===================================================== */

    let currentLyricIndex = -1;

    // Prevents openLetter() from running more than once
    let letterOpened = false;

    // Prevents multiple audio listeners
    let lyricsListenerAdded = false;


    /* =====================================================
       OPEN LETTER
    ===================================================== */

    document
      .getElementById("envelopeSection")
      .addEventListener("click", openLetter);


    function openLetter() {

      // IMPORTANT:
      // If function somehow gets called again,
      // immediately stop it.

      if (letterOpened) {
        return;
      }

      letterOpened = true;


      /* =========================
         PLAY MUSIC
      ========================= */

      const audio =
        document.getElementById("bgMusic");

      audio.currentTime = 0;

      audio
        .play()
        .catch(error => {
          console.log(
            "Audio play error:",
            error
          );
        });


      /* =========================
         HIDE ENVELOPE
      ========================= */

      const envelope =
        document.getElementById(
          "envelopeSection"
        );

      envelope.classList.add("hidden");


      /* =========================
         SHOW CARD
      ========================= */

      const card =
        document.getElementById(
          "cardSection"
        );

      card.classList.remove("hidden");


      /* =========================
         TYPEWRITER
      ========================= */

      setTimeout(() => {

        typeWriterEffect(
          fullMessage,
          "typedText",
          50
        );

      }, 2000);


      /* =========================
         LYRICS LISTENER
      ========================= */

      if (!lyricsListenerAdded) {

        lyricsListenerAdded = true;

        audio.addEventListener(
          "timeupdate",
          updateLyrics
        );

      }

    }


    /* =====================================================
       UPDATE LYRICS
    ===================================================== */

    function updateLyrics() {

      const audio =
        document.getElementById(
          "bgMusic"
        );

      const currentTime =
        audio.currentTime;


      let activeIndex = -1;


      for (
        let i = 0;
        i < timedLyrics.length;
        i++
      ) {

        if (
          currentTime >=
          timedLyrics[i].time
        ) {

          activeIndex = i;

        }

      }


      if (
        activeIndex !== -1 &&
        activeIndex !== currentLyricIndex
      ) {

        currentLyricIndex =
          activeIndex;

        updateLyricDisplay(
          timedLyrics[
            currentLyricIndex
          ].text
        );

      }

    }


    /* =====================================================
       UPDATE LYRIC DISPLAY
    ===================================================== */

    function updateLyricDisplay(newText) {

      const box =
        document.getElementById(
          "lyricsBox"
        );


      box.style.opacity = "0";


      setTimeout(() => {

        box.textContent = newText;

        box.style.opacity = "1";

      }, 300);

    }


    /* =====================================================
       TYPEWRITER EFFECT
    ===================================================== */

    function typeWriterEffect(
      text,
      elementId,
      speed
    ) {

      const elem =
        document.getElementById(
          elementId
        );


      // Completely clear old content
      elem.textContent = "";


      /*
        Array.from() properly handles
        emojis and Unicode characters.
      */

      const characters =
        Array.from(text);


      let i = 0;


      function type() {

        if (
          i < characters.length
        ) {

          /*
            IMPORTANT FIX:

            আগে innerHTML += ব্যবহার করা হচ্ছিল।
            এখন textContent ব্যবহার করছি।

            এতে HTML parsing / duplicate
            rendering issue হবে না।
          */

          elem.textContent +=
            characters[i];


          i++;


          setTimeout(
            type,
            speed
          );

        }

        else {

          // Remove blinking cursor
          elem.classList.remove(
            "typewriter-cursor"
          );


          // Show final button
          setTimeout(() => {

            const btn =
              document.getElementById(
                "finalWishBtn"
              );

            btn.classList.remove(
              "hidden"
            );

          }, 400);

        }

      }


      type();

    }


    /* =====================================================
       FLOATING HEARTS
    ===================================================== */

    function createFloatingHearts() {

      setInterval(() => {

        const heart =
          document.createElement(
            "div"
          );


        heart.className =
          "heart";


        heart.innerHTML =
          [
            "❤️",
            "💖",
            "💕",
            "💗",
            "💘"
          ][
            Math.floor(
              Math.random() * 5
            )
          ];


        heart.style.left =
          Math.random() * 100 + "vw";


        heart.style.fontSize =
          18 +
          Math.random() * 28 +
          "px";


        heart.style.animationDuration =
          4 +
          Math.random() * 4 +
          "s";


        document.body.appendChild(
          heart
        );


        setTimeout(() => {

          heart.remove();

        }, 8000);


      }, 350);

    }


    /* =====================================================
       SPARKLES
    ===================================================== */

    function createSparkles() {

      for (
        let i = 0;
        i < 35;
        i++
      ) {

        const sp =
          document.createElement(
            "div"
          );


        sp.className =
          "sparkle";


        sp.style.left =
          Math.random() * 100 +
          "vw";


        sp.style.top =
          Math.random() * 100 +
          "vh";


        sp.style.animationDelay =
          Math.random() * 3 +
          "s";


        document.body.appendChild(
          sp
        );

      }

    }


    /* =====================================================
       START BACKGROUND ANIMATIONS
    ===================================================== */

    createFloatingHearts();

    createSparkles();

  </script>

</body>
</html>
